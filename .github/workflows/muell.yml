name: Müllabfuhr-Termine holen

on:
  schedule:
    - cron: "17 4 * * 1"   # jeden Montag früh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  muell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Termine für Irresheim holen
        run: python tools/muell.py Irresheim
      - name: Speichern, falls geändert
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add daten/
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Müllabfuhr-Termine aktualisiert"
          git pull --rebase origin main
          git push
