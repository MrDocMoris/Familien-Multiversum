function editBin(b){
  const f = b ? {...b} : {kind:'rest', name:WASTE_KINDS.rest.n, every:2, start:todayStr()};
  openSheet(`<h2>${b ? 'Tonne bearbeiten' : 'Tonne hinzufügen'}</h2>
    <label class="f">Art</label><div class="seg" id="b-kind">${Object.entries(WASTE_KINDS).map(([k, w]) => `<button data-k="${k}" class="${f.kind === k ? 'on' : ''}">${w.e}</button>`).join('')}</div>
    <label class="f">Name</label><input type="text" id="b-name" maxlength="30" value="${esc(f.name)}">
    <label class="f">Wie oft?</label><div class="seg" id="b-every">${[1, 2, 3, 4].map(n => `<button data-n="${n}" class="${f.every === n ? 'on' : ''}">${n === 1 ? 'Jede Woche' : `${n} Wochen`}</button>`).join('')}</div>
    <label class="f">Nächster (oder letzter) Abholtag</label><input type="date" id="b-start" value="${esc(f.start)}">
    <div class="btns"><button class="btn pri" id="b-save">Speichern</button><button class="btn" id="b-x">Abbrechen</button></div>
    ${b ? '<div class="btns" style="margin-top:8px"><button class="btn del" id="b-del">Tonne entfernen</button></div>' : ''}`);
  $$('#b-kind button').forEach(x => x.onclick = () => { const old = WASTE_KINDS[f.kind].n; f.kind = x.dataset.k; if(!$('#b-name').value.trim() || $('#b-name').value === old) $('#b-name').value = WASTE_KINDS[f.kind].n; $$('#b-kind button').forEach(y => y.classList.toggle('on', y === x)); });
  $$('#b-every button').forEach(x => x.onclick = () => { f.every = +x.dataset.n; $$('#b-every button').forEach(y => y.classList.toggle('on', y === x)); });
  $('#b-x').onclick = closeSheet;
  $('#b-save').onclick = () => {
    f.name = $('#b-name').value.trim() || WASTE_KINDS[f.kind].n; f.start = $('#b-start').value;
    if(!f.start){ toast('Bitte einen Abholtag wählen'); return; }
    if(b) Object.assign(b, f); else S.waste.bins.push({...f, id:uid()});
    saveWaste(); closeSheet(); renderWaste();
  };
  if(b) $('#b-del').onclick = () => { S.waste.bins = S.waste.bins.filter(x => x.id !== b.id); saveWaste(); closeSheet(); renderWaste(); };
}
function wasteKindOf(txt){
  const t = txt.toLowerCase();
  if(/rest|grau|schwarz/.test(t)) return 'rest';
  if(/bio|grün|braun/.test(t)) return 'bio';
  if(/papier|pappe|blau|ppk/.test(t)) return 'papier';
  if(/gelb|verpack|lvp|wertstoff/.test(t)) return 'gelb';
  return 'other';
}
function importICS(text){
  const lines = text.replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '').split(/\r?\n/);
  const out = []; let cur = null;
  for(const ln of lines){
    if(ln.startsWith('BEGIN:VEVENT')) cur = {};
    else if(ln.startsWith('END:VEVENT')){ if(cur && cur.date && cur.sum) out.push(cur); cur = null; }
    else if(cur){
      const m = ln.match(/^DTSTART[^:]*:(\d{4})(\d{2})(\d{2})/); if(m) cur.date = `${m[1]}-${m[2]}-${m[3]}`;
      if(/^SUMMARY[;:]/.test(ln)) cur.sum = ln.slice(ln.indexOf(':') + 1).replace(/\\([,;\\])/g, '$1').replace(/\\n/gi, ' ').trim();
    }
  }
  if(!out.length){ toast('In der Datei wurden keine Termine gefunden'); return; }
  const seen = new Set(S.waste.dates.map(d => d.date + '|' + d.name)); let n = 0;
  out.forEach(e => { const name = e.sum.length > 30 ? e.sum.slice(0, 30) + '…' : e.sum, key = e.date + '|' + name;
    if(!seen.has(key)){ seen.add(key); S.waste.dates.push({date:e.date, name, kind:wasteKindOf(e.sum)}); n++; } });
  S.waste.dates.sort((a, b) => a.date.localeCompare(b.date));
  saveWaste(); renderWaste(); renderAll(); toast(`📥 ${n} Abfuhrtermine geladen`);
}
(() => { const inp = document.createElement('input'); inp.type = 'file'; inp.id = 'ics-file'; inp.style.display = 'none';
  inp.onchange = () => { const f = inp.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => importICS(String(r.result)); r.readAsText(f); inp.value = ''; };
  document.body.appendChild(inp); })();

/* ================= Sicherung importieren (zusammenführen) ================= */
function importBackup(text){
  try{ const d = JSON.parse(text); if(!Array.isArray(d.events)) throw 0;
    const stamp = x => x.changed || x.created || 0;
    const merge = (mine, theirs) => { const m = new Map(mine.map(x => [x.id, x])); let n = 0;
      theirs.forEach(x => { const o = m.get(x.id); if(!o || stamp(x) >= stamp(o)){ if(!o) n++; m.set(x.id, x); } }); return [[...m.values()], n]; };
    const me = S.cfg.me, notify = S.cfg.notify; let nE, nL;
    [S.events, nE] = merge(S.events, d.events);
    if(Array.isArray(d.lists)) [S.lists, nL] = merge(S.lists, d.lists);
    if(Array.isArray(d.notes)) [S.notes] = merge(S.notes, d.notes);
    if(d.meals) Object.entries(d.meals).forEach(([k, v]) => { if(!S.meals[k] || (v.changed || 0) >= (S.meals[k].changed || 0)) S.meals[k] = v; });
    if(Array.isArray(d.favs)) d.favs.forEach(f => { if(!S.favs.some(x => x.name.toLowerCase() === f.name.toLowerCase())) S.favs.push(f); });
    if(d.dog && d.dog.items){ const mine = S.dog; S.dog = d.dog; S.dog.items.forEach(it => { const o = (mine.items || []).find(x => x.id === it.id); if(o && (o.last || '') > (it.last || '')) it.last = o.last; }); if(!S.dog.name) S.dog.name = mine.name; if(!S.dog.vet) S.dog.vet = mine.vet; }
    if(d.waste && ((d.waste.bins || []).length || (d.waste.dates || []).length)) S.waste = Object.assign({bins:[], dates:[], remind:true}, d.waste);
    store('fm_notes', S.notes); store('fm_meals', S.meals); store('fm_favmeals', S.favs); store('fm_dog', S.dog); store('fm_waste', S.waste);
    if(d.cfg) S.cfg = Object.assign(S.cfg, d.cfg, {me, notify});
    saveEvents(); saveLists(); saveCfg(); closeSheet(); renderAll(); toast(`Eingefügt: ${nE} neue Termine${nL ? `, ${nL} neue Listen` : ''}`);
  }catch(e){ toast('Das ist keine gültige Sicherung'); }
}
(() => { const inp = document.createElement('input'); inp.type = 'file'; inp.id = 'bk-file'; inp.style.display = 'none';
  inp.onchange = () => { const f = inp.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => importBackup(String(r.result)); r.readAsText(f); inp.value = ''; };
  document.body.appendChild(inp); })();

/* ================= Automatische Sicherung (Dokumente/Familien-Multiversum) ================= */
const BK_DIR = 'Familien-Multiversum';
const backupJSON = () => JSON.stringify({app:'familien-multiversum', v:2, date:new Date().toISOString(), cfg:S.cfg, events:S.events, lists:S.lists || [], meals:S.meals, favs:S.favs, notes:S.notes, dog:S.dog, waste:S.waste});
let _bkT;
function autoBackup(){ if(!NATIVE) return; clearTimeout(_bkT); _bkT = setTimeout(() => writeBackup(false), 3000); }
async function writeBackup(manual){
  const FS = plug('Filesystem');
  if(!FS){ // Browser: als Datei herunterladen
    if(manual){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupJSON()], {type:'application/json'})); a.download = `familien-multiversum-${todayStr()}.json`; a.click(); }
    return;
  }
  try{
    try{ const p = await FS.checkPermissions(); if(p.publicStorage !== 'granted') await FS.requestPermissions(); }catch(e){}
    await FS.writeFile({path:`${BK_DIR}/sicherung-${todayStr()}.json`, data:backupJSON(), directory:'DOCUMENTS', encoding:'utf8', recursive:true});
    store('fm_lastbk', Date.now()); renderBackupInfo();
    try{ // nur die letzten 7 Sicherungen behalten
      const r = await FS.readdir({path:BK_DIR, directory:'DOCUMENTS'});
      const files = (r.files || []).map(f => typeof f === 'string' ? f : f.name).filter(n => /^sicherung-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort();
      for(const n of files.slice(0, Math.max(0, files.length - 7))) await FS.deleteFile({path:`${BK_DIR}/${n}`, directory:'DOCUMENTS'}).catch(() => {});
    }catch(e){}
    if(manual) toast('💾 Gesichert in Dokumente/Familien-Multiversum');
  }catch(e){ if(manual) toast('Sicherung fehlgeschlagen: ' + (e.message || e)); }
}
function renderBackupInfo(){
  const el = $('#bk-info'); if(!el) return;
  const t = store('fm_lastbk');
  el.textContent = !NATIVE ? 'Im Browser: „Jetzt sichern“ lädt eine Datei herunter.' : t ? `Letzte Sicherung: ${new Date(t).toLocaleString('de-DE', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})} Uhr` : 'Noch keine Sicherung';
}

/* ================= Erinnerungen (lokale Benachrichtigungen) ================= */
const REM_TIMED = [['none', 'Keine'], ['0', 'Beginn'], ['10', '10 Min'], ['30', '30 Min'], ['60', '1 Std'], ['1440', '1 Tag']];
const REM_DAY = [['none', 'Keine'], ['d0', 'Am Tag'], ['d1', 'Vortag'], ['d3', '3 Tage vorher']];
function normRemind(e){
  const day = e.allDay || YEARLY(e.type), r = e.remind;
  if(!r) return e.type === 'anniv' ? 'd3' : day ? 'd0' : '30';
  if(r === 'none') return r;
  if(day && !r.startsWith('d')) return 'd0';
  if(!day && r.startsWith('d')) return '30';
  return r;
}
const hashId = str => { let h = 0; for(let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) % 2000000000 + 1; };
let _schedT;
function scheduleReminders(){ if(!NATIVE) return; clearTimeout(_schedT); _schedT = setTimeout(doSchedule, 800); }
async function doSchedule(){
  const LN = plug('LocalNotifications'); if(!LN) return;
  try{
    const pend = await LN.getPending();
    if(pend.notifications && pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n => ({id:n.id}))});
    if(!S.cfg.notify) return;
    const perm = await LN.checkPermissions(); if(perm.display !== 'granted') return;
    const now = Date.now(), t = todayStr(), list = [];
    for(let i = 0; i <= 45; i++){
      const ds = addDays(t, i);
      for(const e of S.events){
        if(!visible(e) || occStart(e, ds) !== ds) continue;
        const r = normRemind(e); if(r === 'none') continue;
        const at = parse(ds);
        if(r === 'd0') at.setHours(9, 0, 0, 0);
        else if(r === 'd1' || r === 'd3'){ at.setDate(at.getDate() - (r === 'd3' ? 3 : 1)); at.setHours(18, 0, 0, 0); }
        else { const [hh, mm] = (e.start || '09:00').split(':').map(Number); at.setHours(hh, mm, 0, 0); at.setTime(at.getTime() - Number(r) * 60000); }
        if(at.getTime() <= now + 5000) continue;
        let title, body;
        const whenDay = r === 'd3' ? 'in 3 Tagen' : r === 'd1' ? 'morgen' : 'heute';
        if(e.type === 'bday'){
          const age = ageOn(e, ds);
          title = `🎂 ${e.title}`;
          body = `hat ${whenDay} Geburtstag` + (age > 0 ? ` und wird ${age}` : '') + (r !== 'd0' ? ' – Geschenk? 🎁' : ' 🎉');
        } else if(e.type === 'anniv'){
          const n = ageOn(e, ds);
          title = `💍 ${n > 0 ? n + '. ' : ''}${e.title}`;
          body = `ist ${whenDay}` + (r !== 'd0' ? ' – schon was geplant? 💐' : ' 🥂');
        } else {
          title = `📅 ${e.title}`;
          const when = e.allDay ? (r === 'd3' ? 'In 3 Tagen' : r === 'd1' ? 'Morgen' : 'Heute') + (spanDays(e) ? ` · bis ${fmtShort(addDays(ds, spanDays(e)))}` : ' · ganztägig')
            : ({'0':'Jetzt', '10':'In 10 Minuten', '30':'In 30 Minuten', '60':'In einer Stunde', '1440':'Morgen'}[r] || '') + ` · ${e.start} Uhr`;
          body = when + (e.note ? `\n${e.note}` : '');
        }
        list.push({id:hashId(e.id + ds), title, body, schedule:{at, allowWhileIdle:true}, extra:{date:ds}});
      }
    }
    // Müllabfuhr: Vorabend 18 Uhr
    if(S.waste.remind) for(let i = 0; i <= 45; i++){
      const ds = addDays(t, i), w = wasteOn(ds); if(!w.length) continue;
      const at = parse(ds); at.setDate(at.getDate() - 1); at.setHours(18, 0, 0, 0);
      if(at.getTime() > now + 5000) list.push({id:hashId('waste' + ds), title:'🗑️ Morgen ist Müllabfuhr', body:w.map(x => (WASTE_KINDS[x.kind] || WASTE_KINDS.other).e + ' ' + x.name).join(' · ') + ' – Tonnen rausstellen', schedule:{at, allowWhileIdle:true}, extra:{date:ds}});
    }
    // Hund: am Fälligkeitstag 9 Uhr
    dogItems().forEach(it => { const d = dogDue(it); if(!d) return; const at = parse(d); at.setHours(9, 0, 0, 0);
      if(at.getTime() > now + 5000 && at.getTime() < now + 60 * 864e5) list.push({id:hashId('dog' + it.id + d), title:`🐶 ${it.name} ist fällig`, body:`${S.dog.name || 'Euer Hund'} · ${everyTxt(it)} · zuletzt am ${fmtDM(it.last)}${it.last.slice(0, 4)}`, schedule:{at, allowWhileIdle:true}, extra:{date:d}}); });
    list.sort((a, b) => a.schedule.at - b.schedule.at);
    if(list.length) await LN.schedule({notifications:list.slice(0, 60)});
  }catch(e){ console.log('Erinnerungen:', e); }
}
async function askNotify(force){
  const LN = plug('LocalNotifications'); if(!LN) return;
  try{
    let p = await LN.checkPermissions();
    if(p.display !== 'granted' && (force || !store('fm_asked'))){ store('fm_asked', 1); p = await LN.requestPermissions(); }
  }catch(e){}
}
async function renderNotifyInfo(){
  const el = $('#s-notinfo'); if(!el) return;
  if(!NATIVE){ el.textContent = 'nur in der Android-App'; return; }
  try{ const p = await plug('LocalNotifications').checkPermissions();
    el.textContent = !S.cfg.notify ? 'aus' : p.display === 'granted' ? 'aktiv – für Termine & Geburtstage' : 'Bitte Benachrichtigungen erlauben (Android-Einstellungen)'; }catch(e){ el.textContent = ''; }
}
if(NATIVE){
  try{ plug('LocalNotifications').addListener('localNotificationActionPerformed', a => { const d = a && a.notification && a.notification.extra && a.notification.extra.date; if(d){ closeSheet(); showView('cal'); select(d); } }); }catch(e){}
}
