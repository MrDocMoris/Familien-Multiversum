name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug-APK bauen (Offline-Modus, ohne google-services.json)
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: familien-multiversum-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Familien-Multiversum.apk

      - name: Als Release "Neueste Version" veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version
          body: "Automatisch gebaut aus ${{ github.sha }}. APK herunterladen und auf dem Handy installieren."
          prerelease: true
          make_latest: false
          files: Familien-Multiversum.apk
