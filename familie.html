<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="mobile-web-app-capable" content="yes">
<title>Familien-Multiversum – euer gemeinsamer Kalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="capacitor.js" onerror="this.remove()"></script>
<style>
:root{
  --bg:#0b0a1a; --panel:#15122c; --panel2:#201c3f; --line:#2f2a58; --text:#efecff; --mute:#9c95c8;
  --grad:linear-gradient(120deg,#6fe3ff 0%,#a78bff 55%,#e59bff 100%); --glow:0 0 18px rgba(130,110,255,.45);
  --acc:#7fe3ff; --ok:#3fd68a; --bad:#ff5c6c;
  --pa:#7fe3ff; --pb:#e59bff;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Space Grotesk",system-ui,sans-serif}
body{background:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(98,70,230,.35),transparent 60%),radial-gradient(ellipse 80% 50% at 100% 100%,rgba(70,200,255,.10),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 34% 72%,#cfc6ff,transparent),radial-gradient(1px 1px at 88% 64%,#fff,transparent),radial-gradient(1px 1px at 55% 38%,#bfefff,transparent),radial-gradient(1.5px 1.5px at 6% 88%,#fff,transparent),radial-gradient(1px 1px at 66% 90%,#fff,transparent),radial-gradient(1px 1px at 22% 46%,#fff,transparent),radial-gradient(1px 1px at 93% 32%,#e3d9ff,transparent),radial-gradient(1px 1px at 44% 8%,#fff,transparent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;flex-direction:column;height:100%}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto}
.view.on{display:block}
.pad{padding:calc(14px + var(--safe-t)) 14px 96px}
/* Navigation unten (wie TCG Multiversum) */
nav{display:flex;background:rgba(17,14,38,.92);backdrop-filter:blur(10px);border-top:1px solid transparent;border-image:var(--grad) 1;padding-bottom:var(--safe-b);position:relative;z-index:5}
nav button{flex:1;min-width:0;padding:10px 0 8px;color:var(--mute);font-size:11px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc);text-shadow:0 0 12px rgba(127,227,255,.6)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(127,227,255,.7))}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--grad);color:#0b0a1a;font-size:10px;font-weight:800;line-height:16px}
nav .badge:empty{display:none}
/* Listen */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 12px 12px;border-radius:18px;background:linear-gradient(160deg,rgba(40,33,84,.9),rgba(22,18,46,.9));border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .12s;min-width:0}
.tile:active{transform:scale(.96)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(rgba(167,139,255,.22),transparent 70%)}
.tile .ti{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(0,0,0,.35);margin-bottom:6px}
.tile .tt{font-weight:700;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ts{font-size:12px;color:var(--mute);line-height:1.3}
.tile.new{border-style:dashed;align-items:center;justify-content:center;color:var(--mute);min-height:128px}
.tile.new .ti{background:var(--panel2);color:var(--acc);border:1px solid var(--line)}
.lhead{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.lhead .lic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.lhead h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:0;z-index:2}
.addrow input{flex:1;font-size:16px;padding:12px 13px;border-radius:12px}
.addrow button{width:48px;border-radius:12px;background:var(--grad);color:#0b0a1a;display:grid;place-items:center;box-shadow:var(--glow);flex:none}
.addrow button svg{width:24px;height:24px}
.li{display:flex;align-items:center;gap:10px;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:13px;padding:4px 6px 4px 4px;margin-bottom:6px}
.li .ck{width:42px;height:42px;display:grid;place-items:center;flex:none}
.li .ck i{width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;transition:all .15s}
.li.done .ck i{background:var(--ok);border-color:var(--ok)}
.li.done .ck i::after{content:"";width:10px;height:5px;border:2.5px solid #0b2416;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.li .tx{flex:1;min-width:0;text-align:left;padding:9px 4px;word-break:break-word}
.li .tx small{display:block;color:var(--mute);font-size:11px}
.li.done .tx{color:var(--mute);text-decoration:line-through}
.li .who{width:8px;height:8px;border-radius:50%;flex:none;margin-right:6px}
.dhead{display:flex;align-items:center;justify-content:space-between}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:22px}
.icons button.on{border-color:var(--acc);box-shadow:var(--glow)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.cols button.on{border-color:#fff;box-shadow:var(--glow)}
h1{font-size:24px;margin:0;background:linear-gradient(90deg,#ffffff,#c9bcff 60%,#8fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:18px 0 8px;font-weight:500}
.muted{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:18px 10px;font-size:14px}
/* Kopf */
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hlogo{width:62px;height:62px;border-radius:17px;box-shadow:0 0 24px rgba(130,110,255,.55),0 0 0 1px rgba(167,139,255,.5);animation:hfloat 5s ease-in-out infinite;flex:none}
@keyframes hfloat{50%{transform:translateY(-4px) rotate(-2deg)}}
.hero .sub{color:var(--mute);font-size:13px;margin-top:2px}
.gearbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);color:var(--acc);box-shadow:var(--glow);flex:none}
.gearbtn svg{width:22px;height:22px;transition:transform .5s}
.gearbtn:active svg{transform:rotate(90deg)}
.hstats{display:flex;gap:8px;margin-bottom:14px}
.hstats div{flex:1;min-width:0;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.hstats b{display:block;font-size:19px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats span{font-size:11px;color:var(--mute)}
/* Monatskarte */
.card{border-radius:18px;background:linear-gradient(160deg,rgba(40,33,84,.9),rgba(22,18,46,.9));border:1px solid var(--line);padding:10px 10px 12px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(rgba(167,139,255,.22),transparent 70%);pointer-events:none}
.mhead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.mhead .t{flex:1;text-align:center;font-weight:700;font-size:18px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(22,24,31,.6);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px}
.chip{padding:7px 12px;border-radius:99px;background:rgba(22,24,31,.85);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip.on{background:var(--grad);color:#0b0a1a;border-color:transparent;box-shadow:var(--glow)}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd span{text-align:center;font-size:11px;color:var(--mute);padding:4px 0}
.wd span:nth-child(n+6){color:#c9a6ff}
.day{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;position:relative;transition:transform .1s}
.day:active{transform:scale(.92)}
.day.other{opacity:.28}
.day.today{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc);font-weight:700}
/* Countdowns & Hinweise */
.cds{display:flex;gap:8px;overflow-x:auto;margin:-4px -14px 14px;padding:4px 14px;scrollbar-width:none}
.cds::-webkit-scrollbar{display:none}
.cd{flex:none;min-width:130px;max-width:170px;text-align:left;border-radius:16px;padding:10px 12px;background:linear-gradient(150deg,rgba(111,227,255,.16),rgba(229,155,255,.16));border:1px solid rgba(167,139,255,.45);box-shadow:0 0 14px rgba(130,110,255,.25)}
.cd b{display:block;font-size:24px;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cd span{display:block;font-size:12px;color:var(--mute)}
.cd .t{color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hints{display:flex;flex-direction:column;gap:6px;margin:-4px 0 14px}
.hint{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:12px;background:rgba(27,23,56,.82);border:1px solid var(--line);font-size:14px}
.hint.warn{border-color:rgba(255,177,61,.5);background:rgba(255,177,61,.10)}
.hint.bad{border-color:rgba(255,92,108,.5);background:rgba(255,92,108,.10)}
.spec.waste{background:rgba(160,160,180,.10)}
.spec.dog{background:rgba(255,177,61,.10);border-color:rgba(255,177,61,.35)}
/* Essen */
.wnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wnav .t{flex:1;text-align:center;font-weight:700}
.meal{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:7px}
.meal .dd{width:44px;flex:none;text-align:center;line-height:1.15}
.meal .dd b{display:block;font-size:18px}
.meal .dd span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.meal.today{border-color:var(--acc);box-shadow:0 0 12px rgba(127,227,255,.25)}
.meal .mn{flex:1;min-width:0}
.meal .mn b{display:block}
.meal .mn small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .mn .plan{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* Pinnwand */
.notes{columns:2;column-gap:10px}
.notec{break-inside:avoid;display:block;width:100%;text-align:left;margin-bottom:10px;border-radius:14px;padding:11px 12px;border:1px solid var(--line);position:relative;overflow:hidden;background:rgba(27,23,56,.9)}
.notec::before{content:"";position:absolute;left:0;top:0;right:0;height:4px}
.notec b{display:block;margin-bottom:4px}
.notec p{margin:0;font-size:13px;color:#d9d3ff;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:hidden}
.notec small{display:block;margin-top:6px;font-size:11px;color:var(--mute)}
/* Hund & Müll */
.care{display:flex;align-items:center;gap:10px;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:8px}
.care .ic{font-size:24px;width:32px;text-align:center;flex:none}
.care .cm{flex:1;min-width:0;text-align:left}
.care .cm b{display:block}
.care .cm small{display:block;font-size:12px;color:var(--mute)}
.care .st{font-size:12px;font-weight:700}
.care .ok{flex:none;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--ok)}
.st.bad{color:var(--bad)} .st.warn{color:#ffb13d} .st.good{color:var(--ok)}
.bin{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:6px}
.dots i.w{border-radius:1.5px}
.subhead{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.subhead h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .mb{position:absolute;left:-2px;right:-2px;height:4px;pointer-events:none}
.day.fer{background:rgba(125,255,181,.17)}
.day.hol>span:first-child{color:#ff9ab0;font-weight:700}
.day.sel.hol>span:first-child{color:#7a0b2c}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.spec{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:14px;border:1px solid var(--line)}
.spec.hol{background:rgba(255,154,176,.12);border-color:rgba(255,154,176,.35)}
.spec.fer{background:rgba(125,255,181,.09);border-color:rgba(125,255,181,.3)}
.spec small{display:block;color:var(--mute);font-size:12px}
.day.sel{background:var(--grad);color:#0b0a1a;font-weight:700;box-shadow:var(--glow)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.day.sel .dots i{box-shadow:0 0 0 1px rgba(11,10,26,.6)}
/* Termine */
.ev{display:flex;gap:10px;align-items:stretch;background:rgba(27,23,56,.82);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.ev:active{transform:scale(.98)}
.ev .bar{width:4px;border-radius:4px;flex:none}
.ev .tm{width:58px;flex:none;font-weight:700;font-size:14px}
.ev .tm small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.ev .mid{flex:1;min-width:0}
.ev .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ev .meta{font-size:12px;color:var(--mute);margin-top:1px}
.ev .note{font-size:13px;color:#cfc8f5;margin-top:3px;white-space:pre-wrap}
.ev .dt{font-size:12px;color:var(--acc);margin-bottom:1px}
#fab{position:fixed;right:18px;bottom:calc(74px + var(--safe-b));width:62px;height:62px;border-radius:50%;background:var(--grad);color:#0b0a1a;box-shadow:0 0 0 3px rgba(167,139,255,.35),0 0 26px rgba(127,227,255,.55);display:grid;place-items:center;z-index:10;transition:transform .1s}
#fab:active{transform:scale(.92)}
#fab svg{width:30px;height:30px}
/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .25s ease;z-index:20;overflow-y:auto;padding:8px 16px calc(18px + var(--safe-b))}
#sheet.on{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none}
#scrim.on{display:block}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:2px auto 12px}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:#7a6cff}
textarea{min-height:64px;resize:vertical}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--grad);color:#0b0a1a;border-color:transparent;font-weight:700}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0 2px}
.tog{width:46px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.tog.on{background:rgba(127,227,255,.25);border-color:var(--acc)}
.tog.on::after{transform:translateX(20px);background:var(--acc)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:120px;padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-weight:500;text-align:center;text-decoration:none;color:var(--text)}
.btn.pri{background:var(--grad);color:#0b0a1a;border-color:transparent;font-weight:700;box-shadow:var(--glow)}
.btn.del{color:var(--bad);border-color:rgba(255,92,108,.4)}
.set-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row input[type=text]{flex:1}
.set-row input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:3px;flex:none}
#toast{position:fixed;z-index:50;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-150%);background:var(--panel2);border:1px solid var(--line);
  padding:9px 16px;border-radius:99px;transition:transform .25s;font-size:14px;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app"><main>
<section class="view on" id="v-cal"><div class="pad">
  <div class="hero">
    <img class="hlogo" id="logo" alt="">
    <div style="flex:1;min-width:0"><h1>Familien-Multiversum</h1><div class="sub" id="greet">Euer gemeinsamer Kalender</div></div>
    <button class="gearbtn" id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="hstats" id="stats"></div>
  <div class="cds" id="cdowns"></div>
  <div class="hints" id="hints"></div>
  <div class="card">
    <div class="mhead">
      <button class="iconbtn" id="prev" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="t" id="mtitle"></div>

<script>
const APP_BUILD = 0; // wird beim Bauen der APK durch die Build-Nummer ersetzt
const UPDATE_INFO = 'https://raw.githubusercontent.com/MrDocMoris/Familien-Multiversum/main/app/version.json';

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); $('#sheet').scrollTop = 0; }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;

/* Android-App (Capacitor) */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const _plugs = {};
function plug(name){
  if(!NATIVE) return null;
  if(!_plugs[name]) _plugs[name] = (window.capacitorExports && window.capacitorExports.registerPlugin) ? window.capacitorExports.registerPlugin(name) : window.Capacitor.Plugins[name];
  return _plugs[name];
}
if(NATIVE){
  try{ plug('App').addListener('backButton', () => { if($('#sheet').classList.contains('on')) closeSheet(); else if(S.view === 'list') showView('lists'); else if(S.view === 'sub') showView('more'); else if(S.view !== 'cal') showView('cal'); else plug('App').exitApp(); }); }catch(e){}
}

/* ================= Daten (offline, auf dem Gerät) ================= */
const S = {
  events: store('fm_events') || [],
  cfg: Object.assign({nameA:'Ich', nameB:'Meine Frau', colorA:'#7fe3ff', colorB:'#e59bff', showHol:true, showFer:true, me:'a', notify:true}, store('fm_cfg') || {}),
  month: null, sel: null, update: null,
};
const saveEvents = () => { store('fm_events', S.events); scheduleReminders(); autoBackup(); };
const saveCfg = () => { store('fm_cfg', S.cfg); applyColors(); scheduleReminders(); autoBackup(); };
function applyColors(){ document.documentElement.style.setProperty('--pa', S.cfg.colorA); document.documentElement.style.setProperty('--pb', S.cfg.colorB); }

/* Datum-Helfer (immer lokale Zeit, Format JJJJ-MM-TT) */
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtLong = s => parse(s).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = s => parse(s).toLocaleDateString('de-DE', {weekday:'short', day:'numeric', month:'short'});
const REPEAT = {none:'Einmalig', weekly:'Jede Woche', monthly:'Jeden Monat', yearly:'Jedes Jahr'};
const REPEAT_SHORT = {none:'Einmal', weekly:'Wöchentl.', monthly:'Monatl.', yearly:'Jährlich'};

/* Findet ein Termin (ggf. wiederholt) an diesem Tag statt? */
// Dauer in Tagen (0 = eintägig)
const YEARLY = t => t === 'bday' || t === 'anniv';
const spanDays = ev => (ev.endDate && ev.endDate > ev.date && !YEARLY(ev.type)) ? Math.round((parse(ev.endDate) - parse(ev.date)) / 864e5) : 0;
// Beginnt an diesem Tag ein Vorkommen (bei Serien) – und welches Vorkommen deckt einen Tag ab?
function occStart(ev, ds){
  const n = spanDays(ev);
  for(let k = 0; k <= n; k++){ const s0 = addDays(ds, -k); if(startsOn(ev, s0)) return s0; }
  return null;
}
const occursOn = (ev, ds) => occStart(ev, ds) !== null;
function startsOn(ev, ds){
  if(ds < ev.date) return false;
  if(ev.until && ds > ev.until) return false;
  if(ds === ev.date) return true;
  const a = parse(ev.date), b = parse(ds);
  switch(ev.repeat){
    case 'weekly': return Math.round((b - a) / 864e5) % 7 === 0;
    case 'monthly': return a.getDate() === b.getDate();
    case 'yearly': return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
    default: return false;
  }
}
const sortEv = (a, b) => (b.allDay - a.allDay) || (a.start || '').localeCompare(b.start || '') || a.title.localeCompare(b.title);
// Sichtbarkeit: 'both' = beide, 'a'/'b' = nur diese Person (auf ihrem Handy)
const visible = e => !e.vis || e.vis === 'both' || e.vis === S.cfg.me;
const meName = () => S.cfg.me === 'b' ? S.cfg.nameB : S.cfg.nameA;
const eventsOn = ds => S.events.filter(e => visible(e) && occursOn(e, ds)).sort(sortEv);
const BDAY_COLOR = 'linear-gradient(180deg,#ffd23f,#ff8a3d)', ANNIV_COLOR = 'linear-gradient(180deg,#ff8ad8,#d6336c)';
function ageOn(e, ds){ return (YEARLY(e.type) && !e.noYear) ? +ds.slice(0, 4) - +e.date.slice(0, 4) : null; }
const whoColor = w => w === 'a' ? 'var(--pa)' : w === 'b' ? 'var(--pb)' : 'linear-gradient(180deg,var(--pa),var(--pb))';
const whoName = w => w === 'a' ? S.cfg.nameA : w === 'b' ? S.cfg.nameB : 'Beide';


/* ================= Feiertage & Schulferien NRW ================= */
// Ostersonntag (Gauß / anonymer gregorianischer Algorithmus)
function easter(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return ymd(new Date(y, mo - 1, da));
}
const _holCache = {};
function holidaysNRW(y){
  if(_holCache[y]) return _holCache[y];
  const o = easter(y), m = {};
  m[`${y}-01-01`] = 'Neujahr';
  m[addDays(o, -2)] = 'Karfreitag';
  m[o] = 'Ostersonntag';
  m[addDays(o, 1)] = 'Ostermontag';
  m[`${y}-05-01`] = 'Tag der Arbeit';
  m[addDays(o, 39)] = 'Christi Himmelfahrt';
  m[addDays(o, 49)] = 'Pfingstsonntag';
  m[addDays(o, 50)] = 'Pfingstmontag';
  m[addDays(o, 60)] = 'Fronleichnam';
  m[`${y}-10-03`] = 'Tag der Deutschen Einheit';
  m[`${y}-11-01`] = 'Allerheiligen';
  m[`${y}-12-25`] = '1. Weihnachtstag';
  m[`${y}-12-26`] = '2. Weihnachtstag';
  return _holCache[y] = m;
}
const holidayOn = ds => S.cfg.showHol ? holidaysNRW(+ds.slice(0, 4))[ds] || null : null;
// Schulferien NRW laut Ferienordnung des Schulministeriums (bis Schuljahr 2029/30)
const FERIEN_NRW = [
  ['Weihnachtsferien', '2025-12-22', '2026-01-06'],
  ['Osterferien', '2026-03-30', '2026-04-11'],
  ['Pfingstferien', '2026-05-26', '2026-05-26'],
  ['Sommerferien', '2026-07-20', '2026-09-01'],
  ['Herbstferien', '2026-10-17', '2026-10-31'],
  ['Weihnachtsferien', '2026-12-23', '2027-01-06'],
  ['Osterferien', '2027-03-22', '2027-04-03'],
  ['Pfingstferien', '2027-05-18', '2027-05-18'],
  ['Sommerferien', '2027-07-19', '2027-08-31'],
  ['Herbstferien', '2027-10-23', '2027-11-06'],
  ['Weihnachtsferien', '2027-12-24', '2028-01-08'],
  ['Osterferien', '2028-04-10', '2028-04-22'],
  ['Sommerferien', '2028-07-10', '2028-08-22'],
  ['Herbstferien', '2028-10-23', '2028-11-04'],
  ['Weihnachtsferien', '2028-12-21', '2029-01-05'],
  ['Osterferien', '2029-03-26', '2029-04-07'],
  ['Pfingstferien', '2029-05-22', '2029-05-22'],
  ['Sommerferien', '2029-07-02', '2029-08-14'],
  ['Herbstferien', '2029-10-15', '2029-10-27'],
  ['Weihnachtsferien', '2029-12-20', '2030-01-04'],
  ['Osterferien', '2030-04-15', '2030-04-27'],
  ['Sommerferien', '2030-06-24', '2030-08-06'],
];
const ferienOn = ds => S.cfg.showFer ? FERIEN_NRW.find(f => ds >= f[1] && ds <= f[2]) || null : null;
const fmtDM = s => { const d = parse(s); return `${d.getDate()}.${d.getMonth() + 1}.`; };
function specRows(ds){
  const h = holidayOn(ds), f = ferienOn(ds);
  const w = wasteOn(ds), dg = dogDueOn(ds);
  return (w.length ? `<div class="spec waste"><span style="font-size:20px">🗑️</span><span><b>${w.map(x => `<i class="bin" style="background:${x.c}"></i>${esc(x.name)}`).join(' &nbsp;')}</b><small>Müllabfuhr – Tonnen am Vorabend rausstellen</small></span></div>` : '') +
    dg.map(it => `<div class="spec dog"><span style="font-size:20px">🐶</span><span><b>${esc(it.icon + ' ' + it.name)} fällig</b><small>${esc(S.dog.name || 'Hunde-Ecke')}</small></span></div>`).join('') +
    (h ? `<div class="spec hol"><span style="font-size:20px">🎉</span><span><b>${esc(h)}</b><small>Feiertag in NRW</small></span></div>` : '') +
    (f ? `<div class="spec fer"><span style="font-size:20px">🏖️</span><span><b>${esc(f[0])}</b><small>${f[1] === f[2] ? 'Schulfrei in NRW' : `Schulferien NRW · ${fmtDM(f[1])} – ${fmtDM(f[2])}${f[2].slice(0, 4)}`}</small></span></div>` : '');
}

/* ================= Anzeige ================= */
function renderStats(){
  if(S.lists) renderBadges();
  const t = todayStr();
  const nToday = eventsOn(t).length;
  let nWeek = 0; for(let i = 0; i < 7; i++) nWeek += eventsOn(addDays(t, i)).length;
  let next = null;
  for(let i = 0; i < 366 && !next; i++){
    const ds = addDays(t, i), now = new Date(), hm = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const list = eventsOn(ds).filter(e => i > 0 || e.allDay || (e.end || e.start || '') >= hm);
    if(list.length) next = {ds, i};
  }
  const nextTxt = !next ? '–' : next.i === 0 ? 'Heute' : next.i === 1 ? 'Morgen' : `in ${next.i} T.`;
  $('#stats').innerHTML = `<div><b>${nToday}</b><span>heute</span></div><div><b>${nWeek}</b><span>nächste 7 Tage</span></div><div><b>${nextTxt}</b><span>nächster Termin</span></div>`;
  const h = new Date().getHours();
  $('#greet').textContent = (h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend') + ', ' + S.cfg.nameA + ' ✨';
}

function renderMonth(){
  const [y, m] = S.month;
  $('#mtitle').textContent = `${MONTHS[m]} ${y}`;
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - off), t = todayStr();
  let html = '';
  // Spuren für mehrtägige Balken festlegen, damit ein Balken nicht springt
  const lane = {}, busy = {};
  for(let i = 0; i < 42; i++){
    const ds = ymd(new Date(y, m, 1 - off + i));
    eventsOn(ds).filter(e => spanDays(e)).map(e => ({e, st:occStart(e, ds)})).sort((a, b) => a.st.localeCompare(b.st) || a.e.id.localeCompare(b.e.id)).forEach(({e, st}) => {
      const key = e.id + '|' + st; if(key in lane) return;
      const en = addDays(st, spanDays(e)); let l = 0;
      const free = l => { for(let x = ds; x <= en; x = addDays(x, 1)) if(busy[x] && busy[x].has(l)) return false; return true; };
      while(!free(l)) l++;
      for(let x = ds; x <= en; x = addDays(x, 1)) (busy[x] = busy[x] || new Set()).add(l);
      lane[key] = l;
    });
  }
  for(let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if(i >= 35 && d.getMonth() !== m) break;
    const ds = ymd(d), evs = eventsOn(ds);
    const who = [...new Set(evs.filter(e => !spanDays(e)).map(e => YEARLY(e.type) ? e.type : e.who))].slice(0, 3);
    // Mehrtägige Termine als durchgehender Balken
    const bars = evs.filter(e => spanDays(e)).map(e => [e, lane[e.id + '|' + occStart(e, ds)] || 0]).filter(([, bi]) => bi < 2).map(([e, bi]) => {
      const st = occStart(e, ds), en = addDays(st, spanDays(e)), dow = (d.getDay() + 6) % 7;
      const l = ds === st || dow === 0, r = ds === en || dow === 6;
      return `<i class="mb" style="bottom:${3 + bi * 6}px;background:${whoColor(e.who)};${l ? 'left:5px;border-top-left-radius:3px;border-bottom-left-radius:3px;' : ''}${r ? 'right:5px;border-top-right-radius:3px;border-bottom-right-radius:3px;' : ''}"></i>`;
    }).join('');
    const hol = holidayOn(ds), fer = ferienOn(ds);
    const cls = ['day', d.getMonth() !== m && 'other', ds === t && 'today', ds === S.sel && 'sel', hol && 'hol', fer && 'fer'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-d="${ds}"><span>${d.getDate()}</span><span class="dots">${who.map(w => `<i style="background:${w === 'bday' ? '#ffb13d' : w === 'anniv' ? '#ff6fae' : whoColor(w)}"></i>`).join('')}${wasteOn(ds).slice(0, 2).map(x => `<i class="w" style="background:${x.c}"></i>`).join('')}</span>${bars}</button>`;
  }
  $('#grid').innerHTML = html;
  $('#legend').innerHTML = (S.cfg.showHol ? '<span><i style="background:#ff9ab0"></i>Feiertag</span>' : '') + (S.cfg.showFer ? '<span><i style="background:rgba(125,255,181,.45)"></i>Schulferien</span>' : '') + (S.waste && (S.waste.bins.length || S.waste.dates.length) ? '<span><i style="background:#8d93a3;border-radius:2px"></i>Müll</span>' : '');
  $$('#grid .day').forEach(b => b.onclick = () => select(b.dataset.d));
}

function evRow(e, ds, showDate){
  const lock = e.vis && e.vis !== 'both' ? (e.vis === S.cfg.me ? '🔒 nur für dich' : '🔒 nur ' + (e.vis === 'b' ? S.cfg.nameB : S.cfg.nameA)) : '';
  const star = e.star ? '⭐ Countdown' : '';
  if(YEARLY(e.type)){
    const age = ageOn(e, ds), bd = e.type === 'bday';
    const name = !bd && age > 0 ? `${age}. ${e.title}` : e.title;
    const meta = [bd ? (age !== null && age > 0 ? `wird ${age}` : 'Geburtstag') : 'Jahrestag', star, lock].filter(Boolean).map(esc).join(' · ');
    return `<button class="ev" data-id="${esc(e.id)}" data-d="${ds}"><span class="bar" style="background:${bd ? BDAY_COLOR : ANNIV_COLOR}"></span>
    <span class="tm" style="font-size:24px;line-height:1.2">${bd ? '🎂' : '💍'}</span>
    <span class="mid">${showDate ? `<div class="dt">${esc(fmtShort(ds))}</div>` : ''}<div class="nm">${esc(name)}</div><div class="meta">${meta}</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}</span></button>`;
  }
  const n = spanDays(e), st = n ? occStart(e, ds) : ds, dayNo = n ? Math.round((parse(ds) - parse(st)) / 864e5) + 1 : 0;
  const first = !n || dayNo === 1, last = !n || dayNo === n + 1;
  const small = t => `<span style="font-size:12px;font-weight:500">${t}</span>`;
  let time, sub = '';
  if(e.allDay || (!first && !last)) time = small('ganztägig');
  else if(first){ time = esc(e.start || ''); if(!n && e.end) sub = `<small>bis ${esc(e.end)}</small>`; else if(n) sub = '<small>Beginn</small>'; }
  else { time = small('bis'); sub = `<small style="font-size:14px;color:var(--text);font-weight:700">${esc(e.end || '')}</small>`; }
  const meta = [n ? `Tag ${dayNo} von ${n + 1}` : '', whoName(e.who), e.repeat && e.repeat !== 'none' ? '↻ ' + REPEAT[e.repeat] : '', star, lock].filter(Boolean).map(esc).join(' · ');
  return `<button class="ev" data-id="${esc(e.id)}" data-d="${ds}"><span class="bar" style="background:${whoColor(e.who)}"></span>
    <span class="tm">${time}${sub}</span>
    <span class="mid">${showDate ? `<div class="dt">${esc(fmtShort(ds))}</div>` : ''}<div class="nm">${esc(e.title)}</div><div class="meta">${meta}</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}</span></button>`;
}

function renderDay(){
  const t = todayStr();
  $('#dtitle').textContent = S.sel === t ? 'Heute · ' + fmtLong(S.sel) : fmtLong(S.sel);
  const list = eventsOn(S.sel);
  $('#dlist').innerHTML = specRows(S.sel) + (list.length ? list.map(e => evRow(e, S.sel)).join('') : '<div class="empty">Keine Termine an diesem Tag.<br>Tippe auf <b>+</b>, um einen anzulegen.</div>');
  // Demnächst: die nächsten 14 Tage ab morgen (bzw. ab dem Tag nach der Auswahl, wenn diese heute ist)
  let up = [];
  for(let i = 1; i <= 14 && up.length < 6; i++){
    const ds = addDays(t, i);
    if(ds === S.sel) continue;
    const h = holidayOn(ds); if(h && up.length < 6) up.push(`<div class="spec hol"><span style="font-size:20px">🎉</span><span><small>${esc(fmtShort(ds))}</small><b>${esc(h)}</b></span></div>`);
    const f = ferienOn(ds); if(f && f[1] === ds && up.length < 6) up.push(`<div class="spec fer"><span style="font-size:20px">🏖️</span><span><small>${esc(fmtShort(ds))}</small><b>${esc(f[0])} beginnen</b></span></div>`);
    eventsOn(ds).filter(e => !spanDays(e) || occStart(e, ds) === ds).forEach(e => up.length < 6 && up.push(evRow(e, ds, true)));
  }
  $('#upcoming').innerHTML = up.join('') || '<div class="empty">In den nächsten zwei Wochen steht nichts an.</div>';
  $$('.ev').forEach(b => b.onclick = () => editEvent(b.dataset.id));
}

/* Wischen im Monat: links/rechts = Monat wechseln */
(() => { let x0 = null, y0 = null; const g = $('.card');
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  g.addEventListener('touchend', e => { if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? $('#next') : $('#prev')).click(); }, {passive:true});
})();

function editEvent(id){
  const ex = id ? S.events.find(e => e.id === id) : null;
  const now = new Date(), h = Math.min(now.getHours() + 1, 22);
  const f = ex ? {type:'event', vis:'both', ...ex} : {type:'event', vis:'both', title:'', date:S.sel, allDay:false, start:`${pad2(h)}:00`, end:`${pad2(h + 1)}:00`, who:'both', repeat:'none', note:''};

    <div class="two"><div style="flex:1.2"><label class="f" id="e-dl">Datum</label><input type="date" id="e-date" value="${esc(f.date)}"></div>
      <div class="ev-only"><label class="f">Bis (mehrtägig)</label><input type="date" id="e-enddate" value="${esc(f.endDate || '')}"></div></div>
    <div class="sw bd-only"><span id="e-yl">Geburtsjahr bekannt<br><small class="muted">dann zeigt die App das Alter an</small></span><button class="tog${f.noYear ? '' : ' on'}" id="e-year" aria-label="Geburtsjahr bekannt"></button></div>
    <div class="ev-only"><div class="sw"><span>Ganztägig</span><button class="tog${f.allDay ? ' on' : ''}" id="e-all" aria-label="Ganztägig"></button></div>
    <div class="two" id="e-times" style="${f.allDay ? 'display:none' : ''}">
      <div><label class="f">Von</label><input type="time" id="e-start" value="${esc(f.start || '')}"></div>
      <div><label class="f">Bis</label><input type="time" id="e-end" value="${esc(f.end || '')}"></div>
    </div>
    <label class="f">Für wen?</label>
    <div class="seg" id="e-who">${[['a', S.cfg.nameA], ['b', S.cfg.nameB], ['both', 'Beide']].map(([k, n]) => `<button data-k="${k}" class="${f.who === k ? 'on' : ''}">${esc(n)}</button>`).join('')}</div>
    <label class="f">Wiederholen</label>
    <div class="seg" id="e-rep">${Object.entries(REPEAT_SHORT).map(([k, n]) => `<button data-k="${k}" class="${(f.repeat || 'none') === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    </div>
    <label class="f">Erinnerung</label>
    <div class="seg" id="e-rem"></div>
    <label class="f">Wer sieht das?</label>
    <div class="seg" id="e-vis"><button data-k="both" class="${f.vis === 'both' ? 'on' : ''}">👥 Wir beide</button><button data-k="${meKey}" class="${f.vis !== 'both' ? 'on' : ''}">🔒 Nur für mich</button></div>
    <div class="sw"><span>⭐ Countdown auf der Startseite<br><small class="muted">„Noch 12 Tage bis …“</small></span><button class="tog${f.star ? ' on' : ''}" id="e-star" aria-label="Countdown"></button></div>
    <label class="f">Notiz</label><textarea id="e-note" maxlength="500" placeholder="optional">${esc(f.note || '')}</textarea>

    ${ex ? `<div class="btns" style="margin-top:8px"><button class="btn del" id="e-del">Löschen</button></div>` : ''}`);
  let applyType = () => {
    const yr = YEARLY(f.type), an = f.type === 'anniv', bd = f.type === 'bday';
    $$('#sheet .bd-only').forEach(x => x.style.display = yr ? '' : 'none');
    $$('#sheet .ev-only').forEach(x => x.style.display = yr ? 'none' : '');
    const word = bd ? 'Geburtstag' : an ? 'Jahrestag' : 'Termin';
    $('#e-h').textContent = ex ? word + ' bearbeiten' : (an ? 'Neuer Jahrestag' : 'Neuer ' + word);
    $('#e-tl').textContent = bd ? 'Wessen Geburtstag?' : an ? 'Was feiert ihr?' : 'Titel';
    $('#e-title').placeholder = bd ? 'z. B. Oma Gisela, Kollege Thomas …' : an ? 'z. B. Hochzeitstag, Kennenlerntag …' : 'z. B. Zahnarzt, Elternabend …';
    $('#e-dl').textContent = bd ? (f.noYear ? 'Geburtstag (Jahr egal)' : 'Geburtsdatum') : an ? (f.noYear ? 'Datum (Jahr egal)' : 'Datum (das erste Mal)') : 'Datum';
    $('#e-yl').innerHTML = an ? 'Jahr bekannt<br><small class="muted">dann zählt die App mit, z. B. „5. Hochzeitstag“</small>' : 'Geburtsjahr bekannt<br><small class="muted">dann zeigt die App das Alter an</small>';
    if(ex) $('#e-del').textContent = yr ? word + ' löschen' : (f.repeat && f.repeat !== 'none' ? 'Ganze Serie löschen' : 'Termin löschen');
  };
  const drawRem = () => {
    const opts = (YEARLY(f.type) || f.allDay) ? REM_DAY : REM_TIMED, cur = normRemind(f);
    $('#e-rem').innerHTML = opts.map(([k, n]) => `<button data-k="${k}" class="${cur === k ? 'on' : ''}">${n}</button>`).join('') + (opts === REM_DAY ? '<small class="muted" style="width:100%;font-size:11px">Am Tag um 9 Uhr · Vortag und 3 Tage vorher um 18 Uhr</small>' : '');
    $$('#e-rem button').forEach(b => b.onclick = () => { f.remind = b.dataset.k; $$('#e-rem button').forEach(x => x.classList.toggle('on', x === b)); });
  };
  const _applyType = applyType;
  applyType = () => { _applyType(); drawRem(); };
  applyType();
  $$('#e-type button').forEach(b => b.onclick = () => { f.type = b.dataset.k; $$('#e-type button').forEach(x => x.classList.toggle('on', x === b)); applyType(); });
  $('#e-star').onclick = () => { f.star = !f.star; $('#e-star').classList.toggle('on', f.star); };
  $$('#e-vis button').forEach(b => b.onclick = () => { f.vis = b.dataset.k; $$('#e-vis button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#e-year').onclick = () => { f.noYear = !f.noYear; $('#e-year').classList.toggle('on', !f.noYear); applyType(); };
  if(!ex) setTimeout(() => $('#e-title').focus(), 260);
  $('#e-all').onclick = () => { f.allDay = !f.allDay; $('#e-all').classList.toggle('on', f.allDay); $('#e-times').style.display = f.allDay ? 'none' : ''; drawRem(); };
  $$('#e-who button').forEach(b => b.onclick = () => { f.who = b.dataset.k; $$('#e-who button').forEach(x => x.classList.toggle('on', x === b)); });
  $$('#e-rep button').forEach(b => b.onclick = () => { f.repeat = b.dataset.k; $$('#e-rep button').forEach(x => x.classList.toggle('on', x === b)); });
  // Beginn verschoben -> Ende mit gleicher Dauer mitverschieben
  let prevStart = f.start;
  $('#e-start').onchange = () => {
    const s = $('#e-start').value, e = $('#e-end').value;
    if(prevStart && s && e){ const toM = t => +t.slice(0, 2) * 60 + +t.slice(3); const dur = toM(e) - toM(prevStart);
      if(dur >= 0){ const m = Math.min(toM(s) + dur, 23 * 60 + 59); $('#e-end').value = `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`; } }
    prevStart = s;
  };
  $('#e-date').onchange = () => { const d = $('#e-date').value, e2 = $('#e-enddate').value; if(e2 && d && e2 < d) $('#e-enddate').value = d; $('#e-enddate').min = d; };
  $('#e-enddate').min = f.date;
  $('#e-cancel').onclick = closeSheet;
  $('#e-save').onclick = () => {
    f.title = $('#e-title').value.trim(); f.date = $('#e-date').value; f.note = $('#e-note').value.trim();
    f.endDate = YEARLY(f.type) ? '' : $('#e-enddate').value;
    if(f.endDate && f.endDate < f.date){ toast('Das Enddatum liegt vor dem Beginn'); return; }
    if(f.endDate === f.date) f.endDate = '';
    f.start = $('#e-start').value; f.end = $('#e-end').value;
    if(!f.title){ toast(f.type === 'bday' ? 'Bitte einen Namen eingeben' : 'Bitte einen Titel eingeben'); $('#e-title').focus(); return; }
    if(!f.date){ toast('Bitte ein Datum wählen'); return; }
    if(YEARLY(f.type)){
      f.allDay = true; f.repeat = 'yearly'; f.who = 'both';
      if(f.noYear){ const d = parse(f.date), cy = new Date().getFullYear(); // ohne Jahr: ab diesem Jahr jährlich
        let ds = ymd(new Date(cy, d.getMonth(), d.getDate())); if(ds > todayStr()) ds = ymd(new Date(cy - 1, d.getMonth(), d.getDate())); f.date = ds; }
    } else { delete f.noYear; }
    if(!f.allDay && !f.start){ toast('Bitte eine Uhrzeit wählen oder „Ganztägig“'); return; }
    if(!f.allDay && !f.endDate && f.end && f.end < f.start){ toast('Das Ende liegt vor dem Beginn'); return; }
    if(f.allDay){ f.start = ''; f.end = ''; }
    f.remind = normRemind(f);
    if(ex){ Object.assign(ex, f, {changed:Date.now()}); }
    else S.events.push({...f, id:Date.now().toString(36) + Math.random().toString(36).slice(2, 7), created:Date.now()});
    saveEvents(); closeSheet(); if(YEARLY(f.type)) renderAll(); else select(f.date); renderStats();
    const em = f.type === 'bday' ? '🎂 ' : f.type === 'anniv' ? '💍 ' : '';
    toast(em + (f.vis !== 'both' ? 'Gespeichert – nur für dich sichtbar' : ex ? 'Gespeichert' : f.type === 'event' ? 'Termin angelegt' : 'Gespeichert'));
  };
  if(ex) $('#e-del').onclick = () => {
    const b = $('#e-del');
    if(!b.dataset.sure){ b.dataset.sure = '1'; b.textContent = 'Wirklich löschen?'; return; }
    S.events = S.events.filter(e => e.id !== ex.id); saveEvents(); closeSheet(); renderAll(); toast('Termin gelöscht');
  };
}

/* ================= App-Updates (wie bei TCG Multiversum) ================= */
async function checkUpdate(manual){
  if(!APP_BUILD && !manual) return; // Browser-Fassung ohne Build-Nummer
  try{
    let r;
    try{ r = await fetch(UPDATE_INFO + '?t=' + Date.now(), {cache:'no-store'}); }
    catch(e){ if(manual) toast('Keine Verbindung – bist du online?'); return; }
    if(!r.ok){ if(manual) toast(r.status === 404 ? 'Update-Info nicht gefunden – ist das GitHub-Repo öffentlich?' : `Update-Server antwortet nicht (Fehler ${r.status})`); return; }
    const v = await r.json(); // {build, notes, size, apk}
    const build = parseInt(v.build, 10);
    S.update = (build > APP_BUILD && v.apk) ? {build, url:v.apk, notes:v.notes || '', size:v.size} : null;
    renderUpdateInfo();
    if(S.update){ if(manual || store('fm_upd_skip') !== build) showUpdateSheet(); }
    else if(manual) toast('Du hast die neueste Version');
  }catch(e){ if(manual) toast('Update-Info ist fehlerhaft'); }
}
function renderUpdateInfo(){
  const el = $('#upd-info'); if(!el) return;
  el.innerHTML = `Version 1.${APP_BUILD || '–'}` + (S.update ? ` · <b style="color:var(--acc)">1.${S.update.build} verfügbar</b>` : '');
}
function showUpdateSheet(){
  const u = S.update; if(!u) return;
  const notes = u.notes.replace(/\r/g, '').replace(/^#+\s*/gm, '').replace(/\*\*/g, '').trim();
  openSheet(`
    <h2 style="margin:0 0 4px">Neue Version 1.${u.build}</h2>
    <p class="muted" style="margin:0 0 10px">Du hast 1.${APP_BUILD}.${u.size ? ` Download ca. ${(u.size / 1048576).toLocaleString('de-DE', {maximumFractionDigits:1})} MB.` : ''}</p>
    ${notes ? `<div style="white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px">${esc(notes)}</div>` : ''}
    <div class="btns"><button class="btn pri" id="u-go">Jetzt aktualisieren</button><button class="btn" id="u-later">Später</button></div>
    <p class="muted" style="font-size:12px;margin-top:10px">Die neue APK wird im Browser geladen. Danach auf die Datei tippen und „Installieren" wählen. Deine Termine bleiben erhalten.</p>`);
  $('#u-go').onclick = () => {
    if(NATIVE) plug('Browser').open({url:u.url}).catch(() => { location.href = u.url; });
    else location.href = u.url;
  };
  $('#u-later').onclick = () => { store('fm_upd_skip', u.build); closeSheet(); };
}

  const n = S.lists.reduce((a, l) => a + openCount(l), 0);
  $('#b-lists').textContent = n ? (n > 99 ? '99+' : n) : '';
  const t = eventsOn(todayStr()).length;
  $('#b-cal').textContent = t || '';
}

function renderLists(){
  $('#ltiles').innerHTML = S.lists.map(l => {
    const o = openCount(l), d = l.items.length - o;
    const sub = !l.items.length ? 'Leer' : o ? `${o} offen${d ? ` · ${d} erledigt` : ''}` : 'Alles erledigt 🎉';
    return `<button class="tile" data-id="${esc(l.id)}"><span class="ti" style="background:${grad(l.color)}">${esc(l.icon)}</span><span class="tt">${esc(l.name)}</span><span class="ts">${sub}</span></button>`;
  }).join('') + `<button class="tile new" id="l-new"><span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>Neue Liste</span></button>`;
  $$('#ltiles .tile[data-id]').forEach(b => b.onclick = () => { S.listId = b.dataset.id; showView('list'); });
  $('#l-new').onclick = () => editListMeta(null);
}

function renderList(){
  const l = curList(); if(!l){ showView('lists'); return; }
  const open = l.items.filter(i => !i.done), done = l.items.filter(i => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const row = i => `<div class="li${i.done ? ' done' : ''}" data-id="${esc(i.id)}"><button class="ck" aria-label="Abhaken"><i></i></button><button class="tx">${esc(i.text)}${i.note ? `<small>${esc(i.note)}</small>` : ''}</button>${i.who && i.who !== 'both' ? `<span class="who" style="background:${i.who === 'a' ? 'var(--pa)' : 'var(--pb)'}"></span>` : ''}</div>`;
  $('#ldetail').innerHTML = `
    <div class="lhead">
      <button class="iconbtn" id="l-back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="lic" style="background:${grad(l.color)}">${esc(l.icon)}</span>
      <h1>${esc(l.name)}</h1>
      <button class="iconbtn" id="l-menu" aria-label="Liste bearbeiten"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <form class="addrow" id="l-add"><input type="text" id="l-input" placeholder="Eintrag hinzufügen …" maxlength="120" autocomplete="off" enterkeyhint="done"><button type="submit" aria-label="Hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form>
    ${open.length ? open.map(row).join('') : `<div class="empty">${l.items.length ? 'Alles erledigt 🎉' : 'Noch nichts auf der Liste.<br>Oben eintippen und Enter drücken.'}</div>`}
    ${done.length ? `<div class="dhead"><h3>Erledigt (${done.length})</h3><button class="chip" id="l-clear">Entfernen</button></div>${done.map(row).join('')}` : ''}`;
  $('#l-back').onclick = () => showView('lists');
  $('#l-menu').onclick = () => listMenu(l);
  $('#l-add').onsubmit = e => {
    e.preventDefault();
    const inp = $('#l-input'), t = inp.value.trim(); if(!t) return;
    l.items.unshift({id:uid(), text:t, done:false, created:Date.now()});
    saveLists(); renderList(); $('#l-input').focus();
  };
  $$('#ldetail .li').forEach(r => {
    const it = l.items.find(i => i.id === r.dataset.id);
    r.querySelector('.ck').onclick = () => { it.done = !it.done; it.doneAt = it.done ? Date.now() : null; if(navigator.vibrate) navigator.vibrate(12); saveLists(); renderList(); };
    r.querySelector('.tx').onclick = () => editItem(l, it);
  });
  if($('#l-clear')) $('#l-clear').onclick = () => {
    const b = $('#l-clear'); if(!b.dataset.sure){ b.dataset.sure = '1'; b.textContent = 'Sicher?'; return; }
    l.items = l.items.filter(i => !i.done); saveLists(); renderList(); toast('Erledigte entfernt');
  };
}

function editItem(l, it){
  openSheet(`
    <h2>Eintrag bearbeiten</h2>
    <label class="f">Text</label><input type="text" id="i-text" maxlength="120" value="${esc(it.text)}">
    <label class="f">Notiz (z. B. Menge, Marke)</label><input type="text" id="i-note" maxlength="120" value="${esc(it.note || '')}" placeholder="optional">
    <label class="f">Wer kümmert sich?</label>
    <div class="seg" id="i-who">${[['a', S.cfg.nameA], ['b', S.cfg.nameB], ['both', 'Egal']].map(([k, n]) => `<button data-k="${k}" class="${(it.who || 'both') === k ? 'on' : ''}">${esc(n)}</button>`).join('')}</div>
    <div class="btns"><button class="btn pri" id="i-save">Speichern</button><button class="btn" id="i-x">Abbrechen</button></div>
    <div class="btns" style="margin-top:8px"><button class="btn del" id="i-del">Eintrag löschen</button></div>`);
  let who = it.who || 'both';
  $$('#i-who button').forEach(b => b.onclick = () => { who = b.dataset.k; $$('#i-who button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#i-x').onclick = closeSheet;
  $('#i-save').onclick = () => { const t = $('#i-text').value.trim(); if(!t){ toast('Text darf nicht leer sein'); return; }

function listMenu(l){
  openSheet(`
    <h2>${esc(l.name)}</h2>
    <div class="btns" style="flex-direction:column;margin-top:4px">
      <button class="btn" id="m-edit">Name, Symbol &amp; Farbe ändern</button>
      <button class="btn" id="m-uncheck">Alle Haken entfernen</button>
      <button class="btn" id="m-share">Liste als Text kopieren</button>
      <button class="btn del" id="m-del">Liste löschen</button>
    </div>`);
  $('#m-edit').onclick = () => editListMeta(l);
  $('#m-uncheck').onclick = () => { l.items.forEach(i => { i.done = false; i.doneAt = null; }); saveLists(); closeSheet(); renderList(); toast('Alle Einträge wieder offen'); };
  $('#m-share').onclick = async () => {
    const txt = `${l.icon} ${l.name}\n` + l.items.filter(i => !i.done).map(i => `• ${i.text}${i.note ? ` (${i.note})` : ''}`).join('\n');
    try{ await navigator.clipboard.writeText(txt); toast('Liste kopiert – z. B. in WhatsApp einfügen'); closeSheet(); }
    catch(e){ openSheet(`<h2>Liste</h2><textarea style="min-height:200px" readonly>${esc(txt)}</textarea><div class="btns"><button class="btn" onclick="closeSheet()">Schließen</button></div>`); }
  };
  $('#m-del').onclick = () => {
    const b = $('#m-del'); if(!b.dataset.sure){ b.dataset.sure = '1'; b.textContent = `„${l.name}“ wirklich löschen?`; return; }
    S.lists = S.lists.filter(x => x.id !== l.id); saveLists(); closeSheet(); showView('lists'); toast('Liste gelöscht');
  };

function editListMeta(l){
  const f = l ? {name:l.name, icon:l.icon, color:l.color} : {name:'', icon:LIST_ICONS[S.lists.length % LIST_ICONS.length], color:LIST_COLORS[(S.lists.length * 2 + 1) % LIST_COLORS.length]};
  openSheet(`
    <h2>${l ? 'Liste bearbeiten' : 'Neue Liste'}</h2>
    ${l ? '' : `<label class="f">Vorlage</label><div class="chips" id="n-tpl"><button class="chip on" data-t="">Leer</button>${Object.entries(LIST_TPL).map(([k, t]) => `<button class="chip" data-t="${k}">${t.icon} ${esc(t.name)}</button>`).join('')}</div>`}
    <label class="f">Name</label><input type="text" id="n-name" maxlength="30" placeholder="z. B. Drogerie, Urlaub packen …" value="${esc(f.name)}">
    <label class="f">Symbol</label><div class="icons" id="n-icons">${LIST_ICONS.map(i => `<button data-i="${i}" class="${i === f.icon ? 'on' : ''}">${i}</button>`).join('')}</div>
    <label class="f">Farbe</label><div class="cols" id="n-cols">${LIST_COLORS.map(c => `<button data-c="${c}" class="${c === f.color ? 'on' : ''}" style="background:${grad(c)}"></button>`).join('')}</div>
    <div class="btns"><button class="btn pri" id="n-save">${l ? 'Speichern' : 'Liste anlegen'}</button><button class="btn" id="n-x">Abbrechen</button></div>`);
  if(!l) setTimeout(() => $('#n-name').focus(), 260);
  $$('#n-tpl button').forEach(b => b.onclick = () => {
    $$('#n-tpl button').forEach(x => x.classList.toggle('on', x === b)); f.tpl = b.dataset.t;
    const t = LIST_TPL[f.tpl]; if(!t) return;
    $('#n-name').value = t.name; f.icon = t.icon; f.color = t.color;
    $$('#n-icons button').forEach(x => x.classList.toggle('on', x.dataset.i === f.icon)); $$('#n-cols button').forEach(x => x.classList.toggle('on', x.dataset.c === f.color));
  });
  $$('#n-icons button').forEach(b => b.onclick = () => { f.icon = b.dataset.i; $$('#n-icons button').forEach(x => x.classList.toggle('on', x === b)); });
  $$('#n-cols button').forEach(b => b.onclick = () => { f.color = b.dataset.c; $$('#n-cols button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#n-x').onclick = closeSheet;
  $('#n-save').onclick = () => {
    f.name = $('#n-name').value.trim(); if(!f.name){ toast('Bitte einen Namen eingeben'); return; }
    const tpl = LIST_TPL[f.tpl]; delete f.tpl;
    if(l) Object.assign(l, f, {changed:Date.now()}); else { const n = {id:uid(), ...f, items:tpl ? tpl.items.map((t, i) => ({id:uid(), text:t, done:false, created:Date.now() - i})) : [], created:Date.now()}; S.lists.push(n); S.listId = n.id; }
    saveLists(); closeSheet(); showView(l ? 'list' : 'list');
  };
}

/* Etwas auf die Einkaufsliste setzen (doppelte offene Einträge werden übersprungen) */
function shoppingList(){
  let l = S.lists.find(x => x.icon === '🛒') || S.lists.find(x => /einkauf/i.test(x.name));
  if(!l){ l = {id:uid(), name:'Einkaufsliste', icon:'🛒', color:LIST_COLORS[2], items:[], created:Date.now()}; S.lists.unshift(l); }
  return l;
}
function addToShopping(texts){
  const l = shoppingList(); let n = 0;
  texts.map(t => t.trim()).filter(Boolean).forEach(t => {
    if(l.items.some(i => !i.done && i.text.toLowerCase() === t.toLowerCase())) return;
    l.items.unshift({id:uid(), text:t, done:false, created:Date.now()}); n++;
  });
  saveLists(); return n;
}
const splitIng = t => String(t || '').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);

/* ================= Countdowns & Hinweise auf der Startseite ================= */
function nextStart(e, from, maxDays = 800){
  for(let i = 0; i <= maxDays; i++){ const ds = addDays(from, i); if(startsOn(e, ds)) return ds; }
  return null;
}
function renderCountdowns(){
  const t = todayStr();
  const list = S.events.filter(e => e.star && visible(e)).map(e => ({e, ds:nextStart(e, t)})).filter(x => x.ds).sort((a, b) => a.ds.localeCompare(b.ds));
  $('#cdowns').style.display = list.length ? '' : 'none';
  $('#cdowns').innerHTML = list.map(({e, ds}) => {
    const n = Math.round((parse(ds) - parse(t)) / 864e5);
    const em = e.type === 'bday' ? '🎂' : e.type === 'anniv' ? '💍' : '⏳';
    const age = ageOn(e, ds), title = e.type === 'anniv' && age > 0 ? `${age}. ${e.title}` : e.title;
    return `<button class="cd" data-d="${ds}"><span>${em} ${n === 0 ? '' : 'noch'}</span><b>${n === 0 ? 'Heute! 🎉' : n === 1 ? '1 Tag' : n + ' Tage'}</b><div class="t">${esc(title)}</div></button>`;
  }).join('');
  $$('#cdowns .cd').forEach(b => b.onclick = () => select(b.dataset.d));
}
function renderHints(){
  const t = todayStr(), out = [];
  for(let i = 0; i <= 1; i++){ const w = wasteOn(addDays(t, i)); if(w.length){ out.push(`<button class="hint${i === 0 ? ' warn' : ''}" data-go="waste">🗑️ <span><b>${i === 0 ? 'Heute' : 'Morgen'}:</b> ${w.map(x => `<i class="bin" style="background:${x.c}"></i>${esc(x.name)}`).join(' ')}</span></button>`); break; } }
  dogItems().forEach(it => {
    const d = dogDue(it); if(!d) return; const n = Math.round((parse(d) - parse(t)) / 864e5);
    if(n <= 7) out.push(`<button class="hint ${n < 0 ? 'bad' : 'warn'}" data-go="dog">🐶 <span><b>${esc(it.name)}</b> ${n < 0 ? `ist seit ${-n} Tag${n === -1 ? '' : 'en'} fällig` : n === 0 ? 'ist heute fällig' : `in ${n} Tag${n === 1 ? '' : 'en'} fällig`}</span></button>`);
  });
  $('#hints').innerHTML = out.join('');
  $('#hints').style.display = out.length ? '' : 'none';
  $$('#hints .hint').forEach(b => b.onclick = () => openSub(b.dataset.go));
  const nm = dogItems().filter(it => { const d = dogDue(it); return d && d <= t; }).length;
  $('#b-more').textContent = nm || '';
}

/* ================= Essensplan ================= */
S.meals = store('fm_meals') || {};
S.favs = store('fm_favmeals') || [];
const saveMeals = () => { store('fm_meals', S.meals); store('fm_favmeals', S.favs); autoBackup(); };
const mondayOf = ds => { const d = parse(ds); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
S.week = mondayOf(todayStr());
const WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
function renderMeals(){
  const t = todayStr(), days = [...Array(7)].map((_, i) => addDays(S.week, i));
  const a = parse(days[0]), b = parse(days[6]);
  const range = `${a.getDate()}.${a.getMonth() !== b.getMonth() ? ' ' + MONTHS[a.getMonth()].slice(0, 3) + '.' : ''} – ${b.getDate()}. ${MONTHS[b.getMonth()]}`;
  const planned = days.filter(d => S.meals[d] && S.meals[d].name).length;
  $('#meals').innerHTML = `
    <div class="hero" style="margin-bottom:12px"><div style="flex:1;min-width:0"><h1>Essensplan</h1><div class="sub">${planned ? `${planned} von 7 Tagen geplant` : 'Was gibt es diese Woche?'}</div></div></div>
    <div class="wnav"><button class="iconbtn" id="w-prev" aria-label="Vorherige Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="t">${range}</div>
      <button class="iconbtn" id="w-next" aria-label="Nächste Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
    ${days.map((d, i) => { const m = S.meals[d]; const dd = parse(d);
      return `<button class="meal${d === t ? ' today' : ''}" data-d="${d}"><span class="dd"><span>${WD[i]}</span><b>${dd.getDate()}</b></span><span class="mn">${m && m.name ? `<b>${esc(m.name)}</b>${m.ing ? `<small>${esc(splitIng(m.ing).join(', '))}</small>` : ''}` : '<span class="plan">+ Gericht planen</span>'}</span></button>`; }).join('')}
    <div class="btns"><button class="btn pri" id="w-shop">🛒 Zutaten der Woche auf die Einkaufsliste</button></div>
    ${S.favs.length ? `<h3>⭐ Lieblingsgerichte (${S.favs.length})</h3><div class="chips">${S.favs.map((f, i) => `<button class="chip" data-fi="${i}">${esc(f.name)}</button>`).join('')}</div><p class="muted" style="font-size:12px">Antippen zum Bearbeiten oder Löschen.</p>` : ''}`;
  $('#w-prev').onclick = () => { S.week = addDays(S.week, -7); renderMeals(); };
  $('#w-next').onclick = () => { S.week = addDays(S.week, 7); renderMeals(); };
  $$('#meals .meal').forEach(b => b.onclick = () => editMeal(b.dataset.d));
  $$('#meals [data-fi]').forEach(b => b.onclick = () => editFav(+b.dataset.fi));
  $('#w-shop').onclick = () => {
    const ing = days.flatMap(d => S.meals[d] ? splitIng(S.meals[d].ing) : []);
    if(!ing.length){ toast('Für diese Woche sind keine Zutaten eingetragen'); return; }
    const n = addToShopping(ing); toast(n ? `🛒 ${n} Zutat${n === 1 ? '' : 'en'} auf die Einkaufsliste gesetzt` : 'Steht schon alles auf der Einkaufsliste');
  };
}
function editMeal(ds){
  const m = S.meals[ds] || {name:'', ing:''}; const d = parse(ds);
  const isFav = n => S.favs.some(f => f.name.toLowerCase() === String(n).trim().toLowerCase());
  let fav = m.name ? isFav(m.name) : false;
  openSheet(`
    <h2>${WD[(d.getDay() + 6) % 7]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}</h2>
    ${S.favs.length ? `<label class="f">Lieblingsgerichte</label><div class="chips" id="m-favs">${S.favs.map((f, i) => `<button class="chip" data-fi="${i}">${esc(f.name)}</button>`).join('')}</div>` : ''}
    <label class="f">Gericht</label><input type="text" id="m-name" maxlength="60" placeholder="z. B. Lasagne, Gemüsesuppe …" value="${esc(m.name)}">
    <label class="f">Zutaten (eine pro Zeile oder mit Komma)</label><textarea id="m-ing" placeholder="Hackfleisch&#10;Lasagneplatten&#10;Tomaten">${esc(m.ing || '')}</textarea>
    <div class="sw"><span>⭐ Als Lieblingsgericht merken</span><button class="tog${fav ? ' on' : ''}" id="m-fav"></button></div>
    <div class="btns"><button class="btn pri" id="m-save">Speichern</button><button class="btn" id="m-shop">🛒 Zutaten einkaufen</button></div>
    ${m.name ? '<div class="btns" style="margin-top:8px"><button class="btn del" id="m-del">Gericht entfernen</button></div>' : ''}`);
  $$('#m-favs .chip').forEach(b => b.onclick = () => { const f = S.favs[+b.dataset.fi]; $('#m-name').value = f.name; $('#m-ing').value = f.ing || ''; fav = true; $('#m-fav').classList.add('on'); });
  $('#m-fav').onclick = () => { fav = !fav; $('#m-fav').classList.toggle('on', fav); };
  const collect = () => ({name:$('#m-name').value.trim(), ing:$('#m-ing').value.trim()});
  const persist = () => {
    const v = collect(); if(!v.name){ toast('Bitte ein Gericht eingeben'); return false; }
    S.meals[ds] = {...v, changed:Date.now()};
    const i = S.favs.findIndex(f => f.name.toLowerCase() === v.name.toLowerCase());
    if(fav){ if(i >= 0) S.favs[i] = v; else S.favs.push(v); S.favs.sort((a, b) => a.name.localeCompare(b.name)); }
    else if(i >= 0) S.favs.splice(i, 1);
    saveMeals(); return true;
  };
  $('#m-save').onclick = () => { if(persist()){ closeSheet(); renderMeals(); } };
  $('#m-shop').onclick = () => { if(!persist()) return; const ing = splitIng(collect().ing); if(!ing.length){ toast('Keine Zutaten eingetragen'); return; }
    const n = addToShopping(ing); closeSheet(); renderMeals(); toast(n ? `🛒 ${n} Zutat${n === 1 ? '' : 'en'} auf die Einkaufsliste gesetzt` : 'Steht schon alles auf der Einkaufsliste'); };
  if($('#m-del')) $('#m-del').onclick = () => { delete S.meals[ds]; saveMeals(); closeSheet(); renderMeals(); };
}
function editFav(i){
  const f = S.favs[i];
  openSheet(`<h2>⭐ Lieblingsgericht</h2>
    <label class="f">Name</label><input type="text" id="f-name" maxlength="60" value="${esc(f.name)}">
    <label class="f">Zutaten</label><textarea id="f-ing">${esc(f.ing || '')}</textarea>

const WASTE_KINDS = {rest:{n:'Restmüll', c:'#8d93a3', e:'⚫'}, bio:{n:'Biotonne', c:'#a0703f', e:'🟤'}, papier:{n:'Papier', c:'#3d7bff', e:'🔵'}, gelb:{n:'Gelbe Tonne', c:'#ffd23f', e:'🟡'}, other:{n:'Sonstiges', c:'#a78bff', e:'🟣'}};

/* Automatische Abfuhrtermine (RegioEntsorgung, wöchentlich von GitHub geholt) */
const MUELL_URL = 'https://raw.githubusercontent.com/MrDocMoris/Familien-Multiversum/main/daten/muell-irresheim.json';
S.muellSrc = store('fm_muellsrc');
WASTE_KINDS.gelb.n = 'Gelber Sack';
function applyAuto(){
  const a = S.waste.auto, src = S.muellSrc; if(!a || !src || !src.strassen) return false;
  const list = src.strassen[a.street]; if(!list) return false;
  const seen = new Set();
  a.dates = list.map(d => ({date:d.date, kind:wasteKindOf(d.name)})).filter(d => { const k = d.date + d.kind; if(seen.has(k)) return false; seen.add(k); return true; });
  a.stand = src.stand; return true;
}
async function fetchMuell(manual){
  try{
    const r = await fetch(MUELL_URL + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    S.muellSrc = await r.json(); store('fm_muellsrc', S.muellSrc); store('fm_muellfetch', Date.now());
    if(applyAuto()) saveWaste();
    if(manual) toast(`🔄 Abfuhrtermine aktualisiert (Stand ${fmtDM(S.muellSrc.stand)}${S.muellSrc.stand.slice(0, 4)})`);
    if(S.view === 'sub' && S.sub === 'waste') renderWaste();
    if(S.view === 'cal') renderAll();
  }catch(e){ if(manual) toast('Abfuhrtermine konnten nicht geladen werden – Internet?'); }
}
function wasteOn(ds){
  if(!S.waste) return [];
  const out = [];
  S.waste.bins.forEach(b => { if(ds >= b.start && Math.round((parse(ds) - parse(b.start)) / 864e5) % (7 * b.every) === 0) out.push({kind:b.kind, name:b.name, c:WASTE_KINDS[b.kind].c}); });
  S.waste.dates.forEach(d => { if(d.date === ds && !out.some(o => o.name === d.name)) out.push({kind:d.kind, name:d.name, c:WASTE_KINDS[d.kind].c}); });
  if(S.waste.auto) (S.waste.auto.dates || []).forEach(d => { if(d.date === ds && !out.some(o => o.kind === d.kind)) out.push({kind:d.kind, name:WASTE_KINDS[d.kind].n, c:WASTE_KINDS[d.kind].c}); });
  return out;
}
